name: Deploy to GitHub Pages

on:
  push:
    branches: [main, data]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Layer latest data over code
        run: |
          git fetch origin data || true
          git checkout origin/data -- data.js data.json disclosures.json 2>/dev/null \
            || echo "data branch not ready; serving baseline from main"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
